<ng-template #control>
  <select
    [id]="selectId()"
    [class]="selectClasses()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-invalid]="state() === 'invalid' || null"
    [attr.aria-readonly]="readonly() || null"
    [attr.aria-describedby]="describedBy()"
    (mousedown)="onReadonlyPointer($event)"
    (keydown)="onKeydown($event)"
    (change)="onSelect($event)"
    (blur)="onBlur($event)"
  >
    @if (placeholder()) {
      <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
    }
    @for (group of groups(); track $index) {
      @if (group.label) {
        <optgroup [label]="group.label">
          @for (option of group.options; track option.value) {
            <option [value]="option.value" [disabled]="option.disabled" [selected]="option.value === value()">{{ option.label }}</option>
          }
        </optgroup>
      } @else {
        @for (option of group.options; track option.value) {
          <option [value]="option.value" [disabled]="option.disabled" [selected]="option.value === value()">{{ option.label }}</option>
        }
      }
    }
  </select>
</ng-template>

<ng-template #labelText>
  {{ label() }}
  @if (required()) {
    <span class="text-danger" aria-hidden="true">*</span>
  } @else if (optional()) {
    <span class="form-label-optional">(optional)</span>
  }
</ng-template>

@if (floatingLabel()) {
  <div class="form-floating">
    <ng-container [ngTemplateOutlet]="control" />
    <label [for]="selectId()"><ng-container [ngTemplateOutlet]="labelText" /></label>
  </div>
} @else {
  @if (label()) {
    <label [class]="hideLabel() ? 'visually-hidden' : 'form-label'" [for]="selectId()"><ng-container [ngTemplateOutlet]="labelText" /></label>
  }
  <ng-container [ngTemplateOutlet]="control" />
}

@if (showFeedback()) {
  <div [id]="feedbackId()" [class]="feedbackClass()">
    {{ feedback() }}
  </div>
}
@if (helpText()) {
  <div [id]="helpId()" class="form-text">{{ helpText() }}</div>
}
