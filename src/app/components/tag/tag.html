<span [class]="classes()" [attr.aria-disabled]="disabled() || null" [attr.title]="title()">
  @if (iconSize(); as size) {
    <img [src]="'icons/pcr/tag-icon-' + resolvedIcon() + '.svg'" [width]="size[0]" [height]="size[1]" [style.--exos-tag-icon-w]="iconBase()![0]" [style.--exos-tag-icon-h]="iconBase()![1]" [alt]="ai() ? 'AI' : ''" />
  }
  <span class="exos-tag-label">{{ label() }}</span>
</span>
