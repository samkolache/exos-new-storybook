<main class="container py-5">
  <h1 class="mb-3">Exos Storybook</h1>
  <p class="lead">Angular + Bootstrap 5.3.2 (SCSS) + Storybook.</p>

  <div class="d-flex flex-wrap gap-2 mb-3">
    <app-button label="Primary" (clicked)="clicks.update(c => c + 1)" />
    <app-button label="Secondary" variant="secondary" />
    <app-button label="Success" variant="success" />
    <app-button label="Outline" variant="danger" [outline]="true" />
    <app-button label="Disabled" [disabled]="true" />
  </div>

  <p>Primary clicked: <strong>{{ clicks() }}</strong> times</p>
</main>
